[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnguard-ai"
version = "0.1.0"
description = "Customer churn prediction and retention platform"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]